  <text x="48" y="134" fill="#647087" font-size="26" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif" font-weight="400" text-anchor="start">管理操作范围，处理审批，核查结果。</text>
